<section class="block" id="achievements">
  <div class="wrap">
    <h2>Recognition</h2>
    <ul class="rows">
      {% for a in site.data.achievements %}
      <li class="row">
        <h3>{{ a.title }}</h3>
        <p class="muted">{{ a.detail }}</p>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
