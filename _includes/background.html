<section class="block" id="background">
  <div class="wrap">
    <h2>Background</h2>
    <div>
      {% for group in site.data.background %}
      <div class="group">
        <h3>{{ group.label }}</h3>
        {% for item in group.items %}
        <div class="entry">
          <p class="entry-title">{{ item.title }}</p>
          <p>{{ item.detail }}</p>
          {% if item.note %}<p class="muted">{{ item.note }}</p>{% endif %}
        </div>
        {% endfor %}
      </div>
      {% endfor %}
    </div>
  </div>
</section>
