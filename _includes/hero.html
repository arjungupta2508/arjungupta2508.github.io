<section class="hero" id="top">
  <div class="wrap">
    <div class="hero-copy">
      <h1>{{ site.data.profile.headline }}</h1>
      <p class="lead">{{ site.data.profile.summary }}</p>
      <div class="actions">
        <a class="btn btn-primary" href="#publication">Read the research</a>
        <a class="btn btn-secondary" href="mailto:{{ site.data.profile.email }}">Email me</a>
        {% if site.data.profile.github and site.data.profile.github != "YOUR-USERNAME" %}
          <a class="btn btn-secondary" href="https://github.com/{{ site.data.profile.github }}">GitHub</a>
        {% endif %}
      </div>
    </div>

    <figure class="field">
      <canvas id="nn" role="img" aria-label="A small neural network classifying a point into one of three classes"></canvas>
      <figcaption>
        <span>A small network, trained in your browser. Click the square to pick a point.</span>
        <button class="link-btn" id="nn-next" type="button">Classify a new point</button>
      </figcaption>
    </figure>
  </div>
</section>
